name: Kereby Watcher

on:
  schedule:
    # Run every 3 hours. The script self-terminates after ~2h50m,
    # leaving a comfortable buffer before the next scheduled run.
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: watcher-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_USER_ID: ${{ secrets.DISCORD_MENTION_USER_ID }}
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PHONE: ${{ secrets.USER_PHONE }}
          USER_MESSAGE: ${{ secrets.USER_MESSAGE }}
          WATCHER_MAX_RUNTIME_SECONDS: 10200  # 2h50m — exits ~2min early for state persist
          WATCHER_SLEEP_SECONDS: 45
        run: python watcher.py

      - name: Persist watcher state
        if: always()
        run: |
          if [ ! -f seen_ids.json ]; then
            echo "No seen_ids.json file was created."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f seen_ids.json

          if git diff --cached --quiet; then
            echo "No watcher state changes to commit."
            exit 0
          fi

          git commit -m "Update watcher state [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
