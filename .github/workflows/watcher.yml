name: Kereby Watcher

on:
  schedule:
    # Trigger hourly. Each job self-terminates after ~70min (see
    # WATCHER_MAX_RUNTIME_SECONDS), which is longer than this 60min interval, so
    # a fresh run is always queued and — serialised by the concurrency group
    # below — starts the instant the previous one exits. That yields continuous
    # coverage (no blind gaps) and survives GitHub's occasional late/dropped
    # cron ticks, since the running job keeps polling until the next one lands.
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  # Serialise runs: at most one watcher active, with the next held pending so it
  # takes over immediately at handoff (no overlap => no double-polling/applying).
  group: watcher-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_USER_ID: ${{ secrets.DISCORD_MENTION_USER_ID }}
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PHONE: ${{ secrets.USER_PHONE }}
          USER_MESSAGE: ${{ secrets.USER_MESSAGE }}
          WATCHER_MAX_RUNTIME_SECONDS: 4200  # 70min — exits ~2min early to persist state; > 60min cron so runs overlap-handoff
          # Adaptive, Copenhagen-time-aware polling is ON by default. In the peak
          # window it is cache-synced: the feed is CloudFront-cached ~30s, so we
          # use the response Age header to poll just after each refresh (~1-2s
          # latency, ~1 request/cycle) instead of hammering. Off-hours back off to
          # 120-300s. Tune via WATCHER_POLL_*_SECONDS, WATCHER_CDN_CACHE_TTL,
          # WATCHER_CACHE_SYNC_MARGIN/MIN, or WATCHER_ADAPTIVE_POLLING=false.
        run: python watcher.py

      - name: Persist watcher state
        if: always()
        run: |
          if [ ! -f seen_ids.json ]; then
            echo "No seen_ids.json file was created."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f seen_ids.json

          if git diff --cached --quiet; then
            echo "No watcher state changes to commit."
            exit 0
          fi

          git commit -m "Update watcher state [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
