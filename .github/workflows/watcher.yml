name: Kereby Watcher

on:
  schedule:
    # Run every 6 hours. The script internally loops for ~5.5 hours polling every 45s.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: watcher-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # Slightly more headroom while still leaving ~5 min before the next scheduled run
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_USER_ID: ${{ secrets.DISCORD_MENTION_USER_ID }}
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PHONE: ${{ secrets.USER_PHONE }}
          USER_MESSAGE: ${{ secrets.USER_MESSAGE }}
          WATCHER_RUNS: 460 # 460 runs * 45s sleep = ~5.75 hours, keeping us safely under the 6h max
          WATCHER_SLEEP_SECONDS: 45
        run: python watcher.py

      - name: Persist watcher state
        if: always()
        run: |
          if [ ! -f seen_ids.json ]; then
            echo "No seen_ids.json file was created."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f seen_ids.json

          if git diff --cached --quiet; then
            echo "No watcher state changes to commit."
            exit 0
          fi

          git commit -m "Update watcher state [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
